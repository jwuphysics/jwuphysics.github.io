:root{
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="dark"]{
  --bg:#0d1117; --bg2:#161b22; --fg:#e6edf3; --muted:#8b949e; --border:#30363d;
  --green:#3fb950; --blue:#58a6ff; --purple:#bc8cff; --yellow:#d29922; --red:#ff7b72; --cyan:#39c5cf;
  --sel:#1f2d3d;
}
:root[data-theme="light"]{
  --bg:#ffffff; --bg2:#f6f8fa; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0;
  --green:#1a7f37; --blue:#0969da; --purple:#8250df; --yellow:#9a6700; --red:#cf222e; --cyan:#1b7c83;
  --sel:#ddf4ff;
}

/* ---- deck shell ---- */
.deck{
  position:relative; display:flex; flex-direction:column;
  height:100%; overflow:hidden; outline:none;
  background:var(--bg); color:var(--fg);
  font-family:var(--mono); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.deck .stack{position:relative; flex:1; overflow:hidden}
.deck .screen{
  position:absolute; inset:0; padding:2.2em 2.6em;
  display:flex; flex-direction:column; gap:1em; overflow:hidden;
}
.deck .screen.enter{animation:deckIn .34s cubic-bezier(.2,.75,.3,1) both}
.deck .screen.exit{animation:deckOut .24s ease-in both; pointer-events:none}
.deck .screen.enter.back{animation-name:deckInBack}
.deck .screen.exit.back{animation-name:deckOutBack}
@keyframes deckIn{from{transform:translateY(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes deckOut{from{transform:none;opacity:1}to{transform:translateY(-26%);opacity:0}}
@keyframes deckInBack{from{transform:translateY(-30%);opacity:0}to{transform:none;opacity:1}}
@keyframes deckOutBack{from{transform:none;opacity:1}to{transform:translateY(26%);opacity:0}}

/* ---- prompt line ---- */
.deck .prompt{white-space:pre-wrap; word-break:break-word; font-size:1.15em}
.deck .prompt .s{color:var(--green); font-weight:700}
.deck .prompt .cmd{color:var(--fg); font-weight:700}

.deck .cur{
  display:inline-block; width:.6em; height:1.05em; margin-left:.08em;
  background:var(--fg); vertical-align:-.18em;
}

/* ---- slide body ---- */
.deck .out{flex:1; overflow:hidden; display:flex; flex-direction:column; gap:.7em; min-height:0}
.deck .out > *{margin:0}
.deck h4,.deck h5,.deck h6{font-size:1em; color:var(--yellow); font-weight:700; letter-spacing:.04em}
.deck p{max-width:60ch}
.deck strong{color:var(--yellow)}
.deck em{color:var(--cyan); font-style:normal; text-decoration:underline dotted}
.deck del{color:var(--muted)}
.deck a{color:var(--blue)}
.deck code{background:var(--bg2); border:1px solid var(--border); border-radius:3px; padding:0 .3em; color:var(--purple)}
.deck pre{
  background:var(--bg2); border:1px solid var(--border); border-left:3px solid var(--green);
  padding:.7em 1em; overflow:auto; max-height:100%; white-space:pre-wrap;
}
.deck pre code{background:none; border:0; padding:0; color:var(--fg)}
.deck ul,.deck ol{list-style:none; padding:0; display:flex; flex-direction:column; gap:.35em; max-width:64ch}
.deck li{padding-left:1.6em; position:relative}
.deck ul > li::before{content:"—"; position:absolute; left:0; color:var(--green)}
.deck ol{counter-reset:n}
.deck ol > li{counter-increment:n}
.deck ol > li::before{content:counter(n,decimal-leading-zero); position:absolute; left:0; color:var(--purple)}
.deck li ul{margin-top:.35em}
.deck li ul > li::before{content:"·"; color:var(--muted)}
.deck blockquote{border-left:3px solid var(--purple); padding-left:.9em; color:var(--muted); max-width:60ch}
.deck hr{border:0; border-top:1px dashed var(--border); width:100%}
.deck figure{margin:0}
.deck img{max-width:100%; max-height:14em; object-fit:contain; border:1px solid var(--border); background:var(--bg2)}
.deck figcaption{color:var(--muted); font-size:.85em; margin-top:.3em}
.deck table{border-collapse:collapse}
.deck th,.deck td{border:1px solid var(--border); padding:.25em .7em; text-align:left}
.deck th{color:var(--yellow)}

/* ---- title screen ---- */
.deck .screen.is-title .prompt{font-size:1.6em}
.deck .screen.is-title .out{justify-content:flex-start; font-size:1.1em}

/* ---- table of contents / section select ---- */
.deck ul.toc{gap:.15em; max-width:none}
.deck ul.toc li{padding:.15em .7em .15em 2.4em; border:1px solid transparent}
.deck ul.toc li::before{content:none}
.deck ul.toc .ptr{position:absolute; left:.7em; color:var(--green); opacity:0}
.deck ul.toc .n{color:var(--muted); margin-right:1em}
.deck ul.toc li.on{background:var(--sel); border-color:var(--border)}
.deck ul.toc li.on .ptr{opacity:1}
.deck ul.toc li.done .n{color:var(--green)}
.deck ul.toc li.sel .t{color:var(--yellow); font-weight:700}
.deck ul.toc li.sel{border-color:var(--green)}

/* ---- hud ---- */
.deck .hud{
  display:flex; align-items:center; gap:1em; flex-wrap:wrap;
  padding:.55em 2.6em; border-top:1px solid var(--border);
  background:var(--bg2); color:var(--muted); font-size:.72em;
}
.deck .hud .pos{color:var(--green)}
.deck .hud .grow{flex:1}
.deck .hud button{
  font:inherit; font-family:var(--mono); color:var(--muted); background:none;
  border:1px solid var(--border); border-radius:3px; padding:.15em .6em; cursor:pointer;
}
.deck .hud button:hover{color:var(--fg); border-color:var(--fg)}
.deck .hud button:focus-visible,.deck:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

@media (prefers-reduced-motion: reduce){
  .deck .screen.enter,.deck .screen.exit{animation:none}
}
</style>

<style>
*{box-sizing:border-box}
html,body{height:100%}
body{

.card{
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:1.5rem; width:min(26rem,90vw);
}
.card h2{margin:0 0 .4rem; font-size:1rem}
.card p{margin:0 0 1.2rem; color:var(--muted); font-size:.85rem; line-height:1.6}
.card .row{display:flex; gap:.6rem; justify-content:flex-end}
.err{color:var(--red); padding:0 .8rem .5rem; font-size:.75rem}
.err:empty{display:none}

@media (max-width:820px){
  .split{grid-template-columns:1fr; grid-template-rows:minmax(9rem,1fr) minmax(0,1.2fr)}
  .pane + .pane{border-left:0; border-top:1px solid var(--border)}
}
</style>

<body>
<script>
// Surfaces JS errors on screen — phones have no console.
window.addEventListener('error', function (e) {
  var b = document.getElementById('boot');
  if (!b) {
    b = document.createElement('div');
    b.id = 'boot';
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#cf222e;' +
      'color:#fff;font:12px ui-monospace,monospace;padding:.6rem;white-space:pre-wrap';
    b.addEventListener('click', function () { b.remove(); });
    (document.body || document.documentElement).appendChild(b);
  }
  b.textContent = 'error: ' + (e.message || 'unknown') + '\nline ' + (e.lineno || '?') + ' (tap to dismiss)';
});
</script>

<header class="bar">
  <span class="logo">md<b>deck</b></span>
  <span class="tip">drop a zip (markdown + images) anywhere on this page</span>
  <span class="grow"></span>
  <button id="themeBtn" type="button">theme</button>
  <label class="btn" for="fileInput">Upload files</label>
</header>

<main class="split">
  <section class="pane">
    <div class="pane-head"><span>source.md</span><span class="grow"></span><span id="count"></span></div>
    <textarea id="src" spellcheck="false" aria-label="Markdown source"></textarea>
    <div class="err" id="err"></div>
    <div class="assets" id="assets"></div>
  </section>
  <section class="pane">
    <div class="pane-head">
      <span>preview</span><span class="grow"></span>
      <button id="presentBtn">Present</button>
      <button id="exportBtn" class="go">Save deck.html</button>
    </div>
    <div class="stage"><div class="frame"><div id="deck"></div></div></div>
  </section>
</main>

<div class="drop" id="drop"><div class="box">release to load your deck</div></div>

<div class="modal" id="modal">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <h2 id="mtitle">Save your slide deck</h2>
    <p>One HTML file with the images built in. Open it anywhere, no internet needed.</p>
    <div class="row">
      <button id="modalSkip">Not now</button>
      <button id="modalSave" class="go">Save deck.html</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple accept=".md,.markdown,.zip,image/*" aria-label="Upload markdown or zip">

<!-- ============================================================
     DECK ENGINE — runs here and is copied into exported files
     ============================================================ -->
<script id="deckEngine">
window.Deck = (function () {
  var SPEED = { cmd: 13, text: 9, block: 80, toc: 140, line: 55 };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function textNodes(root) {
    var out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var n; while ((n = w.nextNode())) if (n.nodeValue.length) out.push(n);
    return out;
  }
  function ps1() {
    return '<span class="s">$</span> ';
  }
  function pad(i) { return (i < 9 ? '0' : '') + (i + 1); }

  function screenFor(slide) {
    var s = el('div', 'screen' + (slide.type === 'title' ? ' is-title' : ''));
    s.appendChild(el('div', 'prompt', ps1() + '<span class="cmd"></span><b class="cur"></b>'));
    var out = el('div', 'out');
    if (slide.type === 'toc') {
      var ul = el('ul', 'toc');
      slide.sections.forEach(function (name, i) {
        var li = el('li', i < slide.index ? 'done' : '');
        li.innerHTML = '<span class="ptr">&gt;</span><span class="n">' + pad(i) + '</span><span class="t"></span>';
        li.querySelector('.t').textContent = name;
        ul.appendChild(li);
      });
      out.appendChild(ul);
    } else {
      out.innerHTML = slide.html || '';
    }
    s.appendChild(out);
    return s;
  }

  // Types out a screen. Returns { finish, done }
  function play(node, slide, onIdle) {
    var timers = [], state = { done: false };
    var cmdEl = node.querySelector('.cmd');
    var cur = node.querySelector('.cur');
    var out = node.querySelector('.out');
    var title = slide.title || '';
    var isToc = slide.type === 'toc';

    var blocks = isToc ? [] : Array.prototype.slice.call(out.children);
    var nodeMap = blocks.map(function (b) {
      return textNodes(b).map(function (n) { return { n: n, full: n.nodeValue }; });
    });
    blocks.forEach(function (b) { b.style.visibility = 'hidden'; });
    nodeMap.forEach(function (l) { l.forEach(function (o) { o.n.nodeValue = ''; }); });

    var lis = isToc ? Array.prototype.slice.call(node.querySelectorAll('.toc li')) : [];
    if (isToc) lis.forEach(function (li) { li.style.visibility = 'hidden'; });

    function T(fn, ms) { timers.push(setTimeout(fn, ms)); }

    function finish() {
      if (state.done) return;
      state.done = true;
      timers.forEach(clearTimeout); timers.length = 0;
      cmdEl.textContent = title;
      blocks.forEach(function (b) { b.style.visibility = ''; });
      nodeMap.forEach(function (l) { l.forEach(function (o) { o.n.nodeValue = o.full; }); });
      if (isToc) {
        lis.forEach(function (li, i) {
          li.style.visibility = '';
          li.classList.toggle('on', i === slide.index);
          li.classList.toggle('sel', i === slide.index);
        });
      }
      if (cur.parentNode) cur.parentNode.removeChild(cur);
      if (onIdle) onIdle();
    }

    function typeCmd(i) {
      if (i > title.length) { T(start, 230); return; }
      cmdEl.textContent = title.slice(0, i);
      T(function () { typeCmd(i + 1); }, SPEED.cmd);
    }

    function start() { isToc ? runToc() : nextBlock(0); }

    function nextBlock(i) {
      if (i >= blocks.length) { T(finish, 140); return; }
      var b = blocks[i];
      b.style.visibility = '';
      b.appendChild(cur);
      var list = nodeMap[i];
      if (!list.length) { T(function () { nextBlock(i + 1); }, SPEED.block); return; }
      var ni = 0, ci = 0;
      (function step() {
        if (ni >= list.length) { T(function () { nextBlock(i + 1); }, SPEED.block); return; }
        var o = list[ni];
        ci += 2;
        if (ci >= o.full.length) { o.n.nodeValue = o.full; ni++; ci = 0; }
        else o.n.nodeValue = o.full.slice(0, ci);
        T(step, SPEED.text);
      })();
    }

    function runToc() {
      var i = 0;
      (function reveal() {
        if (i >= lis.length) { T(function () { movePtr(slide.from); }, 220); return; }
        lis[i].style.visibility = ''; i++;
        T(reveal, SPEED.line);
      })();
      function movePtr(p) {
        lis.forEach(function (li) { li.classList.remove('on'); });
        if (lis[p]) lis[p].classList.add('on');
        if (p === slide.index) {
          T(function () {
            lis[p].classList.add('sel');
            T(finish, 300);
          }, 300);
          return;
        }
        T(function () { movePtr(p + (slide.index > p ? 1 : -1)); }, SPEED.toc);
      }
    }

    if (reduce) finish(); else typeCmd(0);
    return { finish: finish, state: state };
  }

  function mount(root, slides, opts) {
    opts = opts || {};
    if (!slides || !slides.length) slides = [{ type: 'slide', title: 'empty deck', path: '~', html: '<p>Add a heading to get started.</p>' }];
    root.classList.add('deck');
    root.setAttribute('tabindex', '0');
    root.innerHTML = '<div class="stack"></div><div class="hud">' +
      '<span class="pos"></span><span class="keys">&larr; &rarr; move &middot; click to skip</span>' +
      '<span class="grow"></span><button data-a="theme">theme</button><button data-a="full">full screen</button></div>';

    var stack = root.querySelector('.stack');
    var pos = root.querySelector('.pos');
    var anim = null, idx = -1;

    function show(i, animated) {
      i = Math.max(0, Math.min(slides.length - 1, i));
      var back = i < idx;
      var prev = stack.querySelector('.screen:not(.exit)');
      if (prev) {
        prev.classList.remove('enter', 'back');
        prev.classList.add('exit');
        if (back) prev.classList.add('back');
        setTimeout(function () { prev.remove(); }, 260);
      }
      var node = screenFor(slides[i]);
      if (animated && !reduce) {
        node.classList.add('enter');
        if (back) node.classList.add('back');
      }
      stack.appendChild(node);
      anim = play(node, slides[i]);
      idx = i;
      pos.textContent = (i + 1) + '/' + slides.length;
    }
    function advance() {
      if (anim && !anim.state.done) { anim.finish(); return; }
      if (idx < slides.length - 1) show(idx + 1, true);
    }
    function back() { if (idx > 0) show(idx - 1, true); }
    function full() {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (root.requestFullscreen) root.requestFullscreen();
    }
    function theme() {
      var r = document.documentElement;
      r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
    }

    root.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b) { b.dataset.a === 'full' ? full() : theme(); return; }
      root.focus();
      advance();
    });
    root.addEventListener('keydown', function (e) {
      var k = e.key;
      if (k === 'ArrowRight' || k === ' ' || k === 'Enter' || k === 'PageDown') { e.preventDefault(); advance(); }
      else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); back(); }
      else if (k === 'Home') { show(0, true); }
      else if (k === 'End') { show(slides.length - 1, true); }
      else if (k === 'f' || k === 'F') { full(); }
      else if (k === 't' || k === 'T') { theme(); }
    });

    var ro = new ResizeObserver(function (en) {
      var w = en[0].contentRect.width;
      root.style.fontSize = Math.max(9, Math.min(26, w / 58)) + 'px';
    });
    ro.observe(root);

    show(0, false);
    return {
      goto: show, next: advance, prev: back, full: full,
      destroy: function () { ro.disconnect(); root.innerHTML = ''; }
    };
  }

  return { mount: mount };
})();
</script>

<!-- ============================================================
     APP — markdown parsing, files, export
     ============================================================ -->
<script>
(function () {
  var SAMPLE = [
    '# md deck',
    'Markdown in. A terminal that talks back.',
    '',
    '## Writing',
    '',
    '### Every ### heading is one screen',
    'The heading is typed as a command. Everything under it prints out as the output.',
    '',
    '- Text arrives character by character',
    '- Lists arrive line by line',
    '- Images just appear',
    '',
    '### Sections come from ## headings',
    'When a new `##` section starts, the deck shows a menu and walks the cursor down to it.',
    '',
    '## Using it',
    '',
    '### Drop a zip, get one file',
    'Put a markdown file and its images in a folder, zip it, and drag it onto the page.',
    '',
    '### Controls',
    '1. Right arrow or space for the next screen',
    '2. Left arrow to go back',
    '3. `f` for full screen, `t` to flip the theme'
  ].join('\n');

  var $ = function (s) { return document.querySelector(s); };
  var src = $('#src'), deckEl = $('#deck'), assetsEl = $('#assets'), errEl = $('#err');
  var images = new Map();  // basename + full path -> data url
  var slides = [], deck = null, timer = null;

  /* ---------------- markdown ---------------- */
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // Strips anything that could break out of a quoted attribute, then allows only
  // relative paths, http(s), mailto and image data URLs. Safe to run twice.
  var DATA_IMG = /^data:image\/(?:png|jpeg|gif|svg\+xml|webp|avif|bmp);/i;
  function safeURL(p) {
    var u = String(p).trim().replace(/[\u0000-\u0020\u007f"'`<>\\]/g, '');
    var scheme = u.match(/^([a-z][a-z0-9+.-]*):/i);
    if (scheme) {
      var s = scheme[1].toLowerCase();
      var ok = s === 'http' || s === 'https' || s === 'mailto' || (s === 'data' && DATA_IMG.test(u));
      if (!ok) return '#blocked';
    }
    return u;
  }
  function srcFor(p) {
    var clean = String(p).replace(/^\.?\//, '').replace(/^\.\.\//, '');
    var hit = images.get(clean) || images.get(clean.split('/').pop());
    return hit || safeURL(p);
  }
  function inline(s) {
    s = esc(s);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (m, alt, p) {
      return '<img src="' + srcFor(p) + '" alt="' + alt + '">';
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (m, label, p) {
      return '<a href="' + safeURL(p) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    });
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return s;
  }
  function slug(s) {
    return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 22) || 'section';
  }
  function trunc(s, n) { return s.length > n ? s.slice(0, n - 1).trimEnd() + '\u2026' : s; }

  function tokenize(text) {
    var lines = text.replace(/\r\n?/g, '\n').split('\n'), toks = [], i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*```/.test(line)) {
        var buf = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        toks.push({ t: 'code', v: buf.join('\n') });
        continue;
      }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { toks.push({ t: 'h' + h[1].length, v: h[2].trim() }); i++; continue; }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { toks.push({ t: 'hr' }); i++; continue; }
      if (!line.trim()) { i++; continue; }
      if (/^\s*>/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        toks.push({ t: 'quote', v: q.join(' ') });
        continue;
      }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        var items = [], ordered = /^\s*\d+[.)]\s/.test(line);
        while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
          var m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
          items.push({ depth: Math.floor(m[1].length / 2), v: m[3] });
          i++;
        }
        toks.push({ t: 'list', ordered: ordered, items: items });
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() &&
             !/^\s*(#{1,6}\s|```|>|-{3,}$|([-*+]|\d+[.)])\s)/.test(lines[i])) {
        para.push(lines[i].trim()); i++;
      }
      toks.push({ t: 'p', v: para.join(' ') });
    }
    return toks;
  }

  function toHTML(tok) {
    switch (tok.t) {
      case 'p': {
        var only = tok.v.match(/^!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)$/);
        if (only) {
          return '<figure><img src="' + srcFor(only[2]) + '" alt="' + esc(only[1]) + '">' +
                 (only[1] ? '<figcaption>' + esc(only[1]) + '</figcaption>' : '') + '</figure>';
        }
        return '<p>' + inline(tok.v) + '</p>';
      }
      case 'code': return '<pre><code>' + esc(tok.v) + '</code></pre>';
      case 'quote': return '<blockquote>' + inline(tok.v) + '</blockquote>';
      case 'hr': return '<hr>';
      case 'list': {
        var tag = tok.ordered ? 'ol' : 'ul', html = '<' + tag + '>', open = 0;
        tok.items.forEach(function (it) {
          while (it.depth > open) { html += '<ul>'; open++; }
          while (it.depth < open) { html += '</ul>'; open--; }
          html += '<li>' + inline(it.v) + '</li>';
        });
        while (open-- > 0) html += '</ul>';
        return html + '</' + tag + '>';
      }
      case 'h4': case 'h5': case 'h6': return '<h4>' + inline(tok.v) + '</h4>';
      default: return '';
    }
  }

  function build(text) {
    var toks = tokenize(text);
    var sections = toks.filter(function (t) { return t.t === 'h2'; }).map(function (t) { return t.v; });
    var out = [], cur = null, proto = null, si = -1;

    function flush() {
      if (cur && (cur.parts.length || cur.title)) { cur.html = cur.parts.join(''); delete cur.parts; out.push(cur); }
      cur = null;
    }
    function ensure() {
      if (!cur) cur = { type: proto ? proto.type : 'slide', title: proto ? proto.title : '', path: proto ? proto.path : '~', parts: [] };
      return cur;
    }

    toks.forEach(function (tok) {
      if (tok.t === 'h1') {
        flush();
        proto = { type: 'title', title: trunc(tok.v, 108), path: '~' };
        cur = { type: 'title', title: proto.title, path: '~', parts: [] };
      } else if (tok.t === 'h2') {
        flush();
        si++;
        out.push({ type: 'toc', title: 'select section', path: '~', sections: sections, index: si, from: si === 0 ? 0 : si - 1 });
        proto = { type: 'slide', title: trunc(tok.v, 108), path: '~/' + slug(tok.v) };
        cur = null;
      } else if (tok.t === 'h3') {
        flush();
        proto = { type: 'slide', title: trunc(tok.v, 108), path: si >= 0 ? '~/' + slug(sections[si]) : '~' };
        cur = { type: 'slide', title: proto.title, path: proto.path, parts: [] };
      } else {
        ensure().parts.push(toHTML(tok));
      }
    });
    flush();
    return out;
  }

  /* ---------------- render ---------------- */
  function render() {
    try {
      errEl.textContent = '';
      slides = build(src.value);
      if (deck) deck.destroy();
      deck = window.Deck.mount(deckEl, slides);
      $('#count').textContent = slides.length + ' screens';
    } catch (e) {
      errEl.textContent = 'Could not build the deck: ' + e.message;
    }
  }
  function queueRender() { clearTimeout(timer); timer = setTimeout(render, 350); }

  /* ---------------- export ---------------- */
  function deckTitle() {
    var m = src.value.match(/^#\s+(.*)$/m);
    return m ? m[1].trim() : 'deck';
  }
  function buildFile() {
    var data = JSON.stringify(slides).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="en" data-theme="' + document.documentElement.dataset.theme + '">\n' +
      '<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; ' +
      'script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data: https:; font-src data:; ' +
      'object-src \'none\'; base-uri \'none\'; form-action \'none\'">\n' +
      '<title>' + esc(deckTitle()) + '</title>\n' +
      '<style>' + $('#deckStyle').textContent + '</style>\n' +
      '<style>' + $('#standaloneCss').textContent + '</style>\n</head>\n' +
      '<body>\n<div id="deck"></div>\n' +
      '<script>window.__SLIDES__=' + data + ';<\/script>\n' +
      '<script>' + $('#deckEngine').textContent + '<\/script>\n' +
      '<script>Deck.mount(document.getElementById("deck"),window.__SLIDES__);' +
      'document.getElementById("deck").focus();<\/script>\n</body>\n</html>';
  }
  function saveFile() {
    var blob = new Blob([buildFile()], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = slug(deckTitle()) + '.html';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  /* ---------------- files ---------------- */
  function readAs(file, how) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(r.result); };
      r.onerror = function () { rej(new Error('Could not read ' + file.name)); };
      how === 'text' ? r.readAsText(file) : how === 'buf' ? r.readAsArrayBuffer(file) : r.readAsDataURL(file);
    });
  }
  function bytesToDataURL(bytes, name) {
    var ext = name.split('.').pop().toLowerCase();
    var type = ext === 'svg' ? 'image/svg+xml' : ext === 'jpg' ? 'image/jpeg' : 'image/' + ext;
    return readAs(new File([bytes], name, { type: type }), 'url');
  }
  var MAX_ZIP = 200 * 1024 * 1024;      // archive on disk
  var MAX_EXPANDED = 500 * 1024 * 1024; // everything inside it

  async function unzip(buffer) {
    var dv = new DataView(buffer), u8 = new Uint8Array(buffer), eocd = -1;
    for (var i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('that zip file looks damaged');
    var count = dv.getUint16(eocd + 10, true), p = dv.getUint32(eocd + 16, true), files = [], total = 0;
    for (var k = 0; k < count; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      total += dv.getUint32(p + 24, true);
      if (total > MAX_EXPANDED) throw new Error('the contents of that zip are too big to open');
      var nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      var lho = dv.getUint32(p + 42, true);
      var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
      p += 46 + nlen + elen + clen;
      if (name.endsWith('/') || name.startsWith('__MACOSX') || name.split('/').pop().startsWith('.')) continue;
      var start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
      var data = u8.slice(start, start + csize);
      if (method === 8) {
        data = new Uint8Array(await new Response(
          new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
        ).arrayBuffer());
      } else if (method !== 0) continue;
      files.push({ name: name, data: data });
    }
    return files;
  }

  var IMG = /\.(png|jpe?g|gif|svg|webp|avif|bmp)$/i;
  var MD = /\.(md|markdown|mdown|txt)$/i;

  async function intake(fileList) {
    errEl.textContent = '';
    var list = Array.prototype.slice.call(fileList);
    var md = null, found = new Map();
    try {
      var zip = list.filter(function (f) { return /\.zip$/i.test(f.name); })[0];
      if (zip) {
        if (zip.size > MAX_ZIP) throw new Error('that zip file is too big to open');
        var entries = await unzip(await readAs(zip, 'buf'));
        for (var e of entries) {
          if (MD.test(e.name) && md === null) md = new TextDecoder().decode(e.data);
          else if (IMG.test(e.name)) {
            var url = await bytesToDataURL(e.data, e.name);
            found.set(e.name, url); found.set(e.name.split('/').pop(), url);
          }
        }
      } else {
        for (var f of list) {
          if (MD.test(f.name) && md === null) md = await readAs(f, 'text');
          else if (IMG.test(f.name)) {
            var u = await readAs(f, 'url');
            found.set(f.name, u); found.set(f.name.split('/').pop(), u);
          }
        }
      }
      if (md === null && !found.size) {
        errEl.textContent = 'No markdown or images in there. Drop a .zip, or a .md file with its images.';
        return;
      }
      found.forEach(function (v, k) { images.set(k, v); });
      if (md !== null) src.value = md;
      showAssets();
      render();
      $('#modal').classList.add('on');
      $('#modalSave').focus();
    } catch (err) {
      errEl.textContent = 'Could not open that: ' + err.message;
    }
  }
  function showAssets() {
    var out = [];
    images.forEach(function (v, k) { if (k.indexOf('/') < 0) out.push('<span>' + esc(k) + '</span>'); });
    assetsEl.innerHTML = out.join('');
  }

  /* ---------------- wiring ---------------- */
  src.value = SAMPLE;
  render();

  // A missing element should never take down the listeners registered after it.
  function on(sel, ev, fn) {
    var n = typeof sel === 'string' ? $(sel) : sel;
    if (n) n.addEventListener(ev, fn);
  }

  on(src, 'input', queueRender);
  on('#exportBtn', 'click', saveFile);
  on('#presentBtn', 'click', function () { deckEl.focus(); deck && deck.full(); });
  on('#themeBtn', 'click', function () {
    var r = document.documentElement;
    r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
  });
  // "Upload files" is a <label for="fileInput">, so it needs no click handler.
  on('#fileInput', 'change', function (e) { intake(e.target.files); e.target.value = ''; });

  function closeModal() { $('#modal').classList.remove('on'); }
  on('#modalSkip', 'click', closeModal);
  on('#modalSave', 'click', function () { saveFile(); closeModal(); });
  on('#modal', 'click', function (e) { if (e.target === $('#modal')) closeModal(); });
  on(document, 'keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  var dz = $('#drop'), depth = 0;
  on(window, 'dragenter', function (e) { e.preventDefault(); depth++; dz.classList.add('on'); });
  on(window, 'dragover', function (e) { e.preventDefault(); });
  on(window, 'dragleave', function () { if (--depth <= 0) { depth = 0; dz.classList.remove('on'); } });
  on(window, 'drop', function (e) {
    e.preventDefault(); depth = 0; dz.classList.remove('on');
    if (e.dataTransfer.files.length) intake(e.dataTransfer.files);
  });
})();
</script>
</body>
</html>
